<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Content · style-flowchart</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;
      --sans:'Geist', system-ui, sans-serif;--mono:'Geist Mono', ui-monospace, monospace;--title:'Noto Serif', serif;}
    body{font-family:var(--sans);background:#f5f5f5;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .frame{max-width:1000px;width:100%}
    .eyebrow{font:500 .66rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
    h1{font:400 1.75rem/1.15 var(--title);letter-spacing:-.02em;color:var(--ink);margin-bottom:1.5rem}
    .subtitle{font-size:1rem;line-height:1.55;color:var(--muted);max-width:62ch;margin:-.75rem 0 1.75rem}
    .diagram-container{width:100%;overflow-x:auto;}
    svg{width:100%;min-width:1000px;max-width:1000px;margin:0 auto;display:block}
    @media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
    .nn{font:600 12px var(--sans)}
    .sl{font:400 9px var(--mono);fill:var(--muted)}
    .al{font:400 8px var(--mono);letter-spacing:.1em}
    .ey{font:500 8px var(--mono);letter-spacing:.18em;fill:var(--muted)}
    .ln{font:500 9px var(--mono);letter-spacing:.16em;fill:var(--muted)}
    .lg{font:400 8.5px var(--sans);fill:var(--muted)}
    .callout{font:italic 400 14px 'Noto Serif',serif}
    .hub-name{font:600 16px var(--sans)}
    .big{font:600 14px var(--sans)}
    .cards{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:1rem;margin-top:1.5rem}
    .card{background:#ffffff;border-radius:6px;border:1px solid rgba(45,49,66,0.12);padding:1.25rem}
    .card .ce{font:500 .62rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:.5rem}
    .card h3{font:600 .875rem var(--sans);color:var(--ink);padding-bottom:.75rem;margin-bottom:.75rem;border-bottom:1px solid rgba(45,49,66,0.08);display:flex;gap:.6rem;align-items:center}
    .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    .card ul{list-style:none;color:var(--muted);font-size:.8125rem;line-height:1.55}.card li{margin-bottom:.3rem}.card b{color:var(--ink);font-weight:600}
    .footer{margin-top:2rem;padding-top:1.25rem;border-top:1px solid rgba(45,49,66,0.1);font:.72rem var(--mono);letter-spacing:.06em;color:var(--soft);display:flex;justify-content:space-between}
    .terminal{width:100%;max-width:1082px;background:#f5f5f5;border:1px solid #2b2b2b;border-radius:12px;overflow:hidden}
    .titlebar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#1b1b1b;border-bottom:1px solid #2b2b2b}
    .tdot{width:10px;height:10px;border-radius:50%;background:#5c5c5c}.tdot.accent{background:#bf4520}
    .titlebar-name{flex:1;text-align:center;color:#9a9a9a;font:500 .7rem var(--mono);letter-spacing:.04em;margin-right:46px}
    .tframe{padding:2.25rem 2.5rem 2.5rem}.prompt{color:#9a9a9a;font:500 .8rem var(--mono);margin-bottom:.9rem}.prompt .sign{color:#bf4520}
    .terminal h1{font:700 clamp(1.3rem,2vw + .7rem,1.8rem)/1.25 var(--mono)}.terminal h1::before{content:"# ";color:#5c5c5c}
    </style>
</head>
